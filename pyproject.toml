[project]
name = "bilge"
version = "0.1.0.dev0"
description = "A voice assistant for Windows and Linux that speaks Turkish and English."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "av<17",
    "caldav>=3.5.0",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "faster-whisper>=1.2.1",
    "httpx>=0.27",
    "icalendar>=7.3.0",
    "jeepney>=0.8 ; sys_platform == 'linux'",
    "kaldi-native-fbank>=1.22.3",
    "keyring>=25",
    "livekit>=1.1.20",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "psutil>=7.2.2",
    "pycaw>=20240316 ; sys_platform == 'win32'",
    "pypdf>=6.20.1",
    "recurring-ical-events>=3.8.2",
    "send2trash>=2.1.0",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
    "winrt-runtime>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-data-xml-dom>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-devices-radios>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-media-control>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-ui-notifications>=3.0 ; sys_platform == 'win32'",
]

[project.scripts]
bilge = "bilge.cli:main"

[project.gui-scripts]
bilge-app = "bilge.app.main:main"

[project.optional-dependencies]
app = [
    "pyside6-essentials>=6.8",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pyside6-essentials>=6.8",
    "pytest>=8",
    "radicale>=3.8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# The formatter wraps code; long user-facing strings stay on one line.
ignore = ["E501"]

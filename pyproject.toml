[project]
name = "bilge"
version = "0.1.0.dev0"
description = "A voice assistant for Windows and Linux that speaks Turkish and English."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "av<17",
    "faster-whisper>=1.2.1",
    "httpx>=0.27",
    "kaldi-native-fbank>=1.22.3",
    "keyring>=25",
    "livekit>=1.1.20",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
]

[project.scripts]
bilge = "bilge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# The formatter wraps code; long user-facing strings stay on one line.
ignore = ["E501"]

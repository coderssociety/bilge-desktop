name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked --extra app
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = uv run python -c "from importlib.metadata import version; print(version('bilge'))"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} but pyproject says $version" }
      - run: |
          New-Item -ItemType Directory -Force build | Out-Null
          uv run python packaging/make_icon.py build/bilge.ico
          uv run pyinstaller packaging/bilge.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = uv run python -c "from importlib.metadata import version; print(version('bilge'))"
          & $iscc /DVersion=$version packaging\windows\bilge.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Bilge-Setup-*.exe

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            base: ubuntu:22.04
          - runner: ubuntu-24.04-arm
            base: ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bilge-appimage --build-arg BASE=${{ matrix.base }} packaging/linux
      - run: mkdir -p dist && docker run --rm -v "$PWD":/src:ro -v "$PWD/dist":/out bilge-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*.AppImage

  publish:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
